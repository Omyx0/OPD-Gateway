<!DOCTYPE html>

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 15%, rgba(112, 140, 253, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 25%, rgba(57, 128, 244, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(218, 226, 253, 0.2) 0%, transparent 50%),
                #fcf8fa;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .glass-chip {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.05);
        }
        .glass-chip-active {
            background: rgba(55, 85, 195, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(55, 85, 195, 0.3);
            color: #3755c3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-surface font-body-md min-h-screen flex flex-col relative pb-[100px]">
<div class="aurora-bg"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/40 backdrop-blur-xl border-b border-white/50 flex justify-between items-center px-container-padding-mobile h-16 shadow-[0_2px_10px_-2px_rgba(0,0,0,0.02)]">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary-container bg-white/60 backdrop-blur-md shadow-sm border border-white/80 hover:bg-white/80 transition-colors scale-95 active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary-container">OPD Flow</h1>
</div>
<div class="text-primary-container/70 font-data-mono text-sm font-medium bg-white/50 px-3 py-1 rounded-full border border-white/60">Step 2 of 4</div>
</header>
<!-- Main Content -->
<main class="flex-1 mt-16 px-container-padding-mobile py-6 flex flex-col gap-6">
<!-- Header Section -->
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container mb-2">How are you feeling today?</h2>
<p class="text-on-surface-variant/80">Please describe your symptoms in detail.</p>
</div>
<!-- Input Area -->
<div class="relative glass-panel rounded-3xl p-5 transition-colors focus-within:border-secondary/40 focus-within:bg-white/60">
<textarea class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-on-surface-variant/50 resize-none h-32 text-body-lg" placeholder="E.g., I've had a severe headache and slight fever since yesterday morning..."></textarea>
<!-- Voice Input FAB -->
<button class="absolute bottom-4 right-4 w-14 h-14 rounded-full bg-gradient-to-br from-[#001a42] to-[#131b2e] text-on-primary shadow-[0_8px_16px_-4px_rgba(0,26,66,0.3)] flex items-center justify-center hover:opacity-90 active:scale-95 transition-all z-10 border border-white/20">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Quick Select Chips -->
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant/70 mb-3 uppercase tracking-wider">Common Symptoms</h3>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 -mx-container-padding-mobile px-container-padding-mobile">
<button class="flex-shrink-0 px-5 py-2.5 rounded-2xl glass-chip text-on-surface hover:bg-white/70 transition-colors active:scale-95">Fever</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-2xl glass-chip-active font-semibold transition-colors active:scale-95 shadow-[0_2px_10px_-2px_rgba(55,85,195,0.15)]">Cough</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-2xl glass-chip text-on-surface hover:bg-white/70 transition-colors active:scale-95">Headache</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-2xl glass-chip text-on-surface hover:bg-white/70 transition-colors active:scale-95">Nausea</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-2xl glass-chip text-on-surface hover:bg-white/70 transition-colors active:scale-95">Fatigue</button>
</div>
</div>
<!-- Duration & Severity Selectors -->
<div class="grid grid-cols-2 gap-4">
<!-- Duration -->
<div class="glass-panel rounded-3xl p-5">
<h3 class="font-label-caps text-label-caps text-on-surface-variant/70 mb-3 uppercase tracking-wider">Duration</h3>
<select class="w-full bg-white/40 border border-white/60 rounded-xl py-2.5 px-3 focus:border-secondary/50 focus:ring-0 text-on-surface cursor-pointer shadow-sm">
<option>Less than 24 hours</option>
<option>1-3 days</option>
<option>3-7 days</option>
<option>More than a week</option>
</select>
</div>
<!-- Severity -->
<div class="glass-panel rounded-3xl p-5 flex flex-col justify-between">
<h3 class="font-label-caps text-label-caps text-on-surface-variant/70 mb-2 uppercase tracking-wider">Severity</h3>
<div class="flex items-center justify-between mt-1"><span class="material-symbols-outlined text-[#3980f4] text-headline-md drop-shadow-sm" style='font-variation-settings: "FILL" 1;'>star</span><span class="material-symbols-outlined text-[#3980f4] text-headline-md drop-shadow-sm" style='font-variation-settings: "FILL" 1;'>star</span><span class="material-symbols-outlined text-[#3980f4] text-headline-md drop-shadow-sm" style='font-variation-settings: "FILL" 1;'>star</span><span class="material-symbols-outlined text-outline-variant/40 text-headline-md" style='font-variation-settings: "FILL" 1;'>star</span><span class="material-symbols-outlined text-outline-variant/40 text-headline-md" style='font-variation-settings: "FILL" 1;'>star</span></div>
<div class="text-sm font-medium text-primary-container mt-2 text-center bg-white/40 rounded-lg py-1 border border-white/50">Moderate</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-container-padding-mobile bg-white/40 backdrop-blur-xl border-t border-white/60 pb-safe z-40 shadow-[0_-4px_24px_-8px_rgba(0,0,0,0.05)]">
<button class="w-full bg-gradient-to-r from-[#001a42] to-[#131b2e] text-on-primary rounded-2xl py-4 font-semibold shadow-[0_8px_20px_-6px_rgba(0,26,66,0.4)] border border-white/10 active:scale-95 transition-transform flex items-center justify-center gap-2">
            Continue to Vitals
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</body></html>
