<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>OPD Flow - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e4e2e4",
                        "secondary-container": "#708cfd",
                        "on-secondary-fixed-variant": "#173bab",
                        "on-background": "#1b1b1d",
                        "on-tertiary-container": "#3980f4",
                        "surface-dim": "#dcd9db",
                        "surface-bright": "#fcf8fa",
                        "primary-fixed": "#dae2fd",
                        "on-surface-variant": "#45464d",
                        "tertiary-container": "#001a42",
                        "on-secondary-container": "#00217a",
                        "inverse-surface": "#303032",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e4e2e4",
                        "tertiary-fixed": "#d8e2ff",
                        "outline": "#76777d",
                        "on-tertiary-fixed": "#001a42",
                        "inverse-on-surface": "#f3f0f2",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1b1b1d",
                        "tertiary-fixed-dim": "#adc6ff",
                        "surface-container-low": "#f6f3f5",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-container": "#f0edef",
                        "surface-tint": "#565e74",
                        "primary": "#000000",
                        "background": "#fcf8fa",
                        "outline-variant": "#c6c6cd",
                        "secondary-fixed-dim": "#b8c4ff",
                        "tertiary": "#000000",
                        "on-primary-container": "#7c839b",
                        "primary-container": "#131b2e",
                        "surface": "#fcf8fa",
                        "secondary-fixed": "#dde1ff",
                        "on-error": "#ffffff",
                        "surface-container-high": "#eae7e9",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary-fixed-variant": "#004395",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#001453",
                        "primary-fixed-dim": "#bec6e0",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "on-tertiary": "#ffffff",
                        "secondary": "#3755c3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "bento-radius": "32px",
                        "unit": "4px",
                        "container-padding-mobile": "16px",
                        "card-gap": "24px",
                        "container-padding-desktop": "40px",
                        "safe": "env(safe-area-inset-bottom, 20px)"
                    },
                    "fontFamily": {
                        "headline-md": ["Geist"],
                        "data-mono": ["Geist"],
                        "display-hero": ["Geist"],
                        "body-md": ["Inter"],
                        "label-caps": ["Geist"],
                        "headline-lg": ["Geist"],
                        "headline-lg-mobile": ["Geist"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }],
                        "display-hero": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .aurora-bg {
            background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 50%, #ccfbf1 100%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: var(--spacing-bento-radius);
            padding: 24px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .glass-card:active {
            transform: scale(0.98) translateY(2px);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Mobile specific hiding for desktop elements */
        @media (min-width: 768px) {
            .md-hidden { display: none !important; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="aurora-bg text-slate-800 min-h-screen relative font-body-md text-body-md overflow-x-hidden antialiased flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="glass-panel font-headline-md text-headline-md-mobile fixed top-0 w-full z-50 border-b border-white/40 flex justify-between items-center px-container-padding-mobile h-16"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-[#001a42] flex items-center justify-center text-white font-bold text-sm shadow-md">OP</div><span class="font-headline-md text-headline-md-mobile font-bold text-[#001a42]">OPD Flow</span></div><button class="w-10 h-10 flex items-center justify-center rounded-full text-[#001a42] bg-white/40 shadow-sm relative active:scale-95 transition-transform"><span class="material-symbols-outlined">notifications</span><span class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-white"></span></button></header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-24 pb-28 px-container-padding-mobile flex flex-col gap-card-gap">
<!-- Welcome Section -->
<div class="pt-2 px-2">
<p class="text-slate-500 font-body-md text-body-md font-medium tracking-wide">Good Morning,</p>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-[#001a42] mt-1 tracking-tight">Dr. Sarah Chen</h1>
</div>
<!-- Live Queue Status - Hero Card -->
<div class="glass-card relative overflow-hidden flex flex-col gap-4"><div class="flex justify-between items-center mb-2"><span class="font-label-caps text-label-caps text-slate-500 tracking-wider font-bold">LIVE QUEUE STATUS</span><span class="px-2.5 py-1 bg-teal-50 text-teal-700 border border-teal-100 rounded-full font-label-caps text-[10px] flex items-center gap-1.5 shadow-sm"><span class="w-1.5 h-1.5 rounded-full bg-teal-500 animate-pulse"></span>ACTIVE</span></div><div class="flex flex-col items-center py-4"><span class="font-display-hero text-display-hero text-[#001a42] leading-none font-extrabold drop-shadow-sm">14</span><span class="text-slate-500 font-label-caps mt-2 tracking-widest">CURRENT TOKEN</span></div><div class="h-2.5 w-full bg-white/50 rounded-full overflow-hidden mb-4 shadow-inner border border-white/60"><div class="h-full bg-gradient-to-r from-teal-400 to-[#001a42] w-[65%] rounded-full"></div></div><div class="grid grid-cols-2 border-t border-white/60 pt-5 mt-1"><div class="text-center border-r border-white/60"><p class="text-slate-500 font-label-caps text-[10px] mb-1.5 tracking-wider">AHEAD</p><p class="font-headline-md text-[#001a42] font-bold">4 Patients</p></div><div class="text-center"><p class="text-slate-500 font-label-caps text-[10px] mb-1.5 tracking-wider">EST. WAIT</p><p class="font-headline-md text-[#001a42] font-bold">15 min</p></div></div></div>
<!-- Action Grid -->
<div class="grid grid-cols-2 gap-4"><button class="glass-card flex flex-col items-center justify-center gap-3 !p-6 !bg-[#001a42] text-white shadow-lg shadow-[#001a42]/20 active:scale-95 transition-transform !border-none"><div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center backdrop-blur-md"><span class="material-symbols-outlined text-2xl">person_add</span></div><span class="font-body-md font-semibold tracking-wide">New Check-in</span></button><button class="glass-card flex flex-col items-center justify-center gap-3 !p-6 active:scale-95 transition-transform"><div class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-600 flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-2xl">reorder</span></div><span class="font-body-md font-semibold text-[#001a42] tracking-wide">View Queue</span></button></div>
<!-- Recent Activity Quick Look -->
<div class="glass-card mt-2"><span class="font-label-caps text-label-caps text-slate-500 mb-5 block tracking-wider font-bold">RECENT ACTIVITY</span><div class="flex flex-col"><div class="flex items-center justify-between py-3.5 border-b border-white/60"><div class="flex items-center gap-3.5"><div class="w-2.5 h-2.5 rounded-full bg-teal-500 shadow-sm"></div><p class="font-body-md text-[#001a42] text-sm font-medium">Token 13 Checked Out</p></div><span class="text-slate-400 font-data-mono text-[10px] font-semibold">2m ago</span></div><div class="flex items-center justify-between py-3.5"><div class="flex items-center gap-3.5"><div class="w-2.5 h-2.5 rounded-full bg-slate-300"></div><p class="font-body-md text-slate-500 text-sm font-medium">Token 14 Assigned Room A</p></div><span class="text-slate-400 font-data-mono text-[10px] font-semibold">15m ago</span></div></div></div>
</main>
<!-- BottomNavBar -->
<nav class="glass-panel font-label-caps text-label-caps fixed bottom-0 w-full z-50 rounded-t-[32px] border-t border-white/50 shadow-[0_-8px_32px_rgba(31,38,135,0.05)] flex justify-around items-center px-6 py-4 pb-safe"><button class="flex flex-col items-center justify-center gap-1 text-[#001a42] tap-highlight-transparent active:scale-95 transition-all"><span class="material-symbols-outlined fill text-[28px]">home</span><span class="text-[10px] font-bold tracking-wide mt-0.5">Home</span></button><button class="flex flex-col items-center justify-center gap-1 text-slate-400 tap-highlight-transparent active:scale-95 transition-all hover:text-slate-600"><span class="material-symbols-outlined text-[28px]">reorder</span><span class="text-[10px] font-medium tracking-wide mt-0.5">Queue</span></button><button class="flex flex-col items-center justify-center gap-1 text-slate-400 tap-highlight-transparent active:scale-95 transition-all hover:text-slate-600 relative"><span class="material-symbols-outlined text-[28px]">notifications</span><span class="text-[10px] font-medium tracking-wide mt-0.5">Alerts</span><span class="absolute top-0 right-1.5 w-2 h-2 bg-rose-500 rounded-full border border-white"></span></button><button class="flex flex-col items-center justify-center gap-1 text-slate-400 tap-highlight-transparent active:scale-95 transition-all hover:text-slate-600"><span class="material-symbols-outlined text-[28px]">person</span><span class="text-[10px] font-medium tracking-wide mt-0.5">Profile</span></button></nav>
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</body></html>
